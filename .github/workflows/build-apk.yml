name: Build and Release Capacitor Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify google-services.json exists
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f "android/app/google-services.json" ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              echo "Creating android/app/google-services.json from GitHub secret..."
              mkdir -p android/app
              printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            else
              echo "::error::android/app/google-services.json does not exist! Please ensure android/app/google-services.json is committed in the repository or the GOOGLE_SERVICES_JSON secret is set."
              exit 1
            fi
          fi
          python3 -c "import json; json.load(open('android/app/google-services.json'))" || {
            echo "::error::android/app/google-services.json is not valid JSON"
            exit 1
          }
          echo "Verified android/app/google-services.json exists and is valid JSON."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Web Dependencies & Build Vite App
        env:
          VITE_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F'.' '{print $1}')
          if [ "$JAVA_VERSION" -lt 17 ]; then
            echo "Error: Java version must be 17 or newer."
            exit 1
          fi

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Sync Capacitor Android Project
        run: |
          if [ ! -d "android" ]; then
            echo "android directory missing, adding android platform..."
            npx cap add android
          else
            echo "android directory exists, syncing android assets..."
            npx cap sync android
          fi
          echo "Listing installed Capacitor Android plugins:"
          npx cap ls android

      - name: Verify FirebaseAuthentication Plugin Registration
        run: |
          PLUGINS_JSON="android/app/src/main/assets/capacitor.plugins.json"
          if [ ! -f "$PLUGINS_JSON" ]; then
            echo "::error::Capacitor plugins asset file ($PLUGINS_JSON) does not exist! Native plugins were not synced."
            exit 1
          fi
          echo "Contents of $PLUGINS_JSON:"
          cat "$PLUGINS_JSON"
          if ! grep -q "FirebaseAuthentication" "$PLUGINS_JSON"; then
            echo "::error::FirebaseAuthentication plugin is NOT registered in $PLUGINS_JSON! The native Android plugin is not registered in the APK."
            exit 1
          fi
          echo "Verification passed: FirebaseAuthentication plugin is registered in $PLUGINS_JSON."

      - name: Verify Gradle Wrapper files
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "android/gradlew not found! Checking if Gradle can generate wrapper..."
            if command -v gradle >/dev/null 2>&1; then
              echo "Generating wrapper using Gradle 8.11.1..."
              (cd android && gradle wrapper --gradle-version 8.11.1 --distribution-type all)
            else
              echo "Error: android/gradlew is missing and gradle CLI is not available."
              exit 1
            fi
          fi
          if [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Wrapper JAR missing. Attempting wrapper regeneration..."
            (cd android && gradle wrapper --gradle-version 8.11.1 --distribution-type all)
          fi
          echo "Setting executable bit on android/gradlew..."
          chmod +x android/gradlew
          ls -la android/gradlew android/gradle/wrapper/

      - name: Configure Android debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "Decoding fixed debug keystore from DEBUG_KEYSTORE_BASE64 secret..."
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            cp -f ~/.android/debug.keystore android/debug.keystore 2>/dev/null || true
            echo "Fixed debug keystore successfully configured."
          else
            echo "DEBUG_KEYSTORE_BASE64 secret not found. Falling back to temporary debug keystore..."
            cd android
            if [ -f "debug.keystore" ]; then
              echo "debug.keystore already exists."
            else
              echo "Generating temporary debug keystore..."
              keytool -genkey -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            cp -f debug.keystore ~/.android/debug.keystore
            cd ..
          fi
          echo "Debug keystore SHA-1 / SHA-256 fingerprint verification:"
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android | grep -E "SHA1:|SHA256:" || true

      - name: Configure Android SDK and licenses
        run: |
          if [ -n "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          fi
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon -Dorg.gradle.java.home="$JAVA_HOME"
          cd ..

      - name: Verify Google Sign-In setup inside the built APK
        if: always()
        run: |
          set +e
          EXPECTED_SHA1="6e7fbe52d7ddb14d4db84ed43e9e114d9b3c65c1"
          EXPECTED_WEB="434518018679-56s9v40fv4nmn11co32jemdet4ade9um.apps.googleusercontent.com"
          EXPECTED_PKG="com.zeeshan.app"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          GS_INFO=$(python3 - <<'PY'
          import json
          try:
              d = json.load(open("android/app/google-services.json"))
              c = d["client"][0]
              print("pkg=" + c["client_info"]["android_client_info"]["package_name"])
              for o in c.get("oauth_client", []):
                  if o.get("client_type") == 1:
                      print("hash=" + o["android_info"]["certificate_hash"].lower())
                  if o.get("client_type") == 3:
                      print("web=" + o["client_id"])
          except Exception as e:
              print("error=" + str(e))
          PY
          )
          GS_PKG=$(echo "$GS_INFO" | sed -n 's/^pkg=//p' | head -1)
          GS_HASH=$(echo "$GS_INFO" | sed -n 's/^hash=//p' | head -1)
          GS_WEB=$(echo "$GS_INFO" | sed -n 's/^web=//p' | head -1)

          VALUES_FILE=$(grep -rl "default_web_client_id" android/app/build --include=values.xml 2>/dev/null | head -1)
          BUILT_WEB=""
          if [ -n "$VALUES_FILE" ]; then
            BUILT_WEB=$(sed -n 's/.*name="default_web_client_id"[^>]*>\([^<]*\)<.*/\1/p' "$VALUES_FILE" | head -1)
          fi

          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          [ -z "$APKSIGNER" ] && APKSIGNER=$(command -v apksigner)
          APK_SHA1=""
          if [ -n "$APKSIGNER" ]; then
            APK_SHA1=$("$APKSIGNER" verify --print-certs "$APK" 2>&1 | sed -n 's/.*certificate SHA-1 digest: *//p' | head -1 | tr -d ': ' | tr 'A-F' 'a-f')
          fi

          check() { if [ "$2" = "$3" ] && [ -n "$2" ]; then echo "PASS"; else echo "FAIL"; fi; }
          R1=$(check x "$GS_PKG" "$EXPECTED_PKG")
          R2=$(check x "$GS_HASH" "$EXPECTED_SHA1")
          R3=$(check x "$GS_WEB" "$EXPECTED_WEB")
          R4=$(check x "$BUILT_WEB" "$EXPECTED_WEB")
          R5=$(check x "$APK_SHA1" "$EXPECTED_SHA1")

          {
            echo "### Google Sign-In check"
            echo ""
            echo "| # | Check | Result | Found |"
            echo "|---|-------|--------|-------|"
            echo "| 1 | App name in google-services.json | $R1 | ${GS_PKG:-missing} |"
            echo "| 2 | Signing key (SHA-1) in google-services.json | $R2 | ${GS_HASH:-missing} |"
            echo "| 3 | Web client id in google-services.json | $R3 | ${GS_WEB:-missing} |"
            echo "| 4 | Web client id built into the app | $R4 | ${BUILT_WEB:-NOT FOUND} |"
            echo "| 5 | Real signing key (SHA-1) of the APK | $R5 | ${APK_SHA1:-NOT FOUND} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Verify the APK
        run: |
          EXPECTED_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$EXPECTED_APK" ] && [ -s "$EXPECTED_APK" ]; then
            echo "APK verification passed successfully at $EXPECTED_APK."
          else
            echo "Error: Expected debug APK not found or is empty."
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare-asset
        run: |
          RUN_NUMBER="${{ github.run_number }}"
          REPO_NAME="${{ github.event.repository.name }}"
          SANITIZED_REPO_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]/-/g')
          ASSET_DIR=$(mktemp -d)
          ASSET_NAME="${SANITIZED_REPO_NAME}-debug-build-${RUN_NUMBER}.apk"
          TARGET_PATH="$ASSET_DIR/$ASSET_NAME"
          
          cp android/app/build/outputs/apk/debug/app-debug.apk "$TARGET_PATH"
          echo "asset_path=$TARGET_PATH" >> $GITHUB_OUTPUT
          echo "asset_name=$ASSET_NAME" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: publish-release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          NOTES="Automatically generated debug APK for DukanDesk from commit ${{ github.sha }}."

          gh release create "$TAG" \
            --title "$TITLE" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "$NOTES" \
            "${{ steps.prepare-asset.outputs.asset_path }}#${{ steps.prepare-asset.outputs.asset_name }}"

      - name: Report APK download result
        if: always()
        run: |
          if [ "${{ steps.publish-release.outcome }}" == "success" ]; then
            echo "Release published successfully!"
            {
              echo "### GitHub Release Successful 🚀"
              echo "Download your APK from the release assets or use the backup Actions artifact."
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "Release publishing skipped or failed, but Actions artifact is safe."
            {
              echo "### ⚠️ Release Notice"
              echo "The APK build and Actions artifact (\`app-debug-apk\`) succeeded successfully."
            } >> $GITHUB_STEP_SUMMARY
          fi
